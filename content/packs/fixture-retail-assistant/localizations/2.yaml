preview:
  headline: မရွေးခင် ဆိုင်အလုပ်သမားတစ်ယောက်ကို ကြည့်ပါ
  description: >-
    ဆိုင်အလုပ်သမားတစ်ယောက်နှင့် တစ်နာရီ အတူဆက်လုပ်ပါ။ အလုပ်က အမှန်တကယ် ဘာတောင်းလဲဆိုတာ သိရှိပါစေ။
title: "ဆိုင်အလုပ်ကို စမ်းကြည့်ခြင်း — သရုပ်ဖွဲ့စည်းမှု ထုပ်ပိုးမှု"
summary: >-
  ဆိုင်တွင် အလုပ်လုပ်ခြင်းကို ရွေးချယ်မည်မှမဟုတ်ဘဲ ကြည့်ရှုခြင်းနှင့် မေးခြင်းဖြင့် စမ်းသပ်ရန် သရုပ်ဖွဲ့စည်းမှု ထုပ်ပိုးမှု။
limitations:
  - ဤသရုပ်ဖွဲ့စည်းမှု ထုပ်ပိုးမှုသည် စနစ်ကို စမ်းသပ်ရန်သာ ဖြစ်ပါသည်။ အမှန်တကယ် အလုပ်သမားတစ်ယောက်ကလည်း မရေးသားပါ၊ အတည်ပြုခြင်းလည်း မလုပ်ထားပါ။ လူငယ်များထံ မဝေငှပါ။
  - ဤထုပ်ပိုးမှုတွင် အမှန်တကယ် ဆိုင်၊ အလုပ်ရှင်၊ ပံ့ပိုးသူ သို့မဟုတ် အလုပ်ခေါ်ချင်း မပါဝင်ပါ။
  - ဤထုပ်ပိုးမှုသည် ဆိုင်အလုပ်က သင့်လားဆိုသည်ကို မပြောပါ။ ဘယ်အလုပ်ကို ဦးစားပေး၊ နှိုင်းယှဉ်ချက်၊ အမှတ်အသား မပေးပါ။
  - ဤနေရာတွင် ရေးသားသည့် အရာများသည် ရှာဖွေနေမှုသာ ဖြစ်ပါသည်။ လေ့ကျင့်ရေးကို သက်သေပြုသည့် အထောက်အပံ့ မဟုတ်ပါ၊ အတည်ပြုထားသော စမ်းသပ်မှုလည်း မဟုတ်ပါ။
  - ဤထုပ်ပိုးမှုကို ပံ့ပိုးသည်ဟု ဆိုသော ကုန်ရှင်သည် လုံးဝမရှိသော ခေတ်မီတုံး သရုပ်ဖွဲ့လိုက်ပါသည်။ ပံ့ပိုးမှုအတွက် ငွေ၊ ပစ္စည်း သို့မဟုတ် ဝန်ဆောင်မှု မရှိပါ၊ လူငယ်သူ၏ အချက်အလက်ကို မည်သူမျိး မရရှိနိုင်ပါ။ ပံ့ပိုးသူသည် ထုပ်ပိုးမှု၏ စာသားကို ပြောင်းလဲ၍ မရပါ၊ စမ်းသပ်ချက်များ၏ အစဉ်ကို ပြောင်းလဲ၍ မရပါ။
  - ဤမြန်မာဘာသာစကားသည် သရုပ်ဖွဲ့စည်းမှု ဘာသာပြန်ပါသည်။ မြန်မာစာ နားလည်သူ လူငယ်များနှင့် စမ်းသပ်ခြင်း မလုပ်ရသေးပါ။
  - မြန်မာစာ အကောင်းအစားရေးဖွံ့ဖြန်မှုသည် စာသားဖွဲ့စည်းပုံကိုသာ စစ်ဆေးပါသည်။ စက်ဖဝဲဖြင့် ဖတ်ခြင်း၊ စာလုံးအရွယ်အစား ၂၀၀ ရာခိုင်းခြင်း၊ မြန်မာစာ ကျော်လွှတ်ခြင်းနှင့် စက်ဖဝဲ အမူအနှစ်ကို သီးခြား စမ်းသပ်ရသေးပါသည်။
experiments:
  - id: exp-watch-a-busy-counter
    title: ပျက်သိုင်းရှိသော ဆိုင်ကောင်တစ်ခုကို ကြည့်ရှုခြင်း
    question: ပျက်သိုင်းရှိသော ဆိုင်ကောင်တစ်ခုတွင် လူရှာသူများအား ဝန်ဆောင်ခြင်းသည် နေ့စဉ် လက်တွေ့တွင် ဘာလိုမှားလဲ။
    action: >-
      ဆိုင်အလုပ်သမားတစ်ယောက်အား တစ်နာရီ ကြည့်ရှုရန် ပင်သေးဆိုင် သို့မဟုတ် စျေးချောင်းတစ်ခုတွင် တောင်းပါ။
    timebox: အပတ်ရက်နေ့တစ်ခါ၌ တစ်နာရီသာ။
    whatToNotice: >-
      မည်သည့်အချိန်များတွင် ပင်ပန်မှု ရှိသလဲ၊ မည်သည့်အချိန်များတွင် စိတ်ပြေသလဲ၊ မိမိမသိသော ကျွမ်းကျင်မှု လိုအပ်ခဲ့သလဲ သတိထားပါ။
    reflection: မိမိကြည့်ခဲ့သည့် အချက်သုံးချက်ကို ရေးသားပါ။
    nextFork: >-
      ကျောက်ချိန်နှင့် မတူညီသည့် အချိန်၌ ဆိုင်တစ်ခုကို ထပ်မံကြည့်ရှုပါ။ ပြီးလျှင် ဆိုင်ကောင်တစ်ယောက်အား ပထမဆုတ် အလုပ်အခါအခဲ့ကို မေးမြန်းပါ။ အောက်တန်းကို မဝယယူခင် လေ့ကျင့်ကို မစလိုက်စေရ။
  - id: exp-ask-about-a-stock-check
    title: ပစ္စည်းစစ်ခြင်း အကြောင်း မေးမြန်းခြင်း
    question: လုံးဝတစ်ခု နေရာမှ ပျောက်နေသည်ဆိုတာ ဆိုင်ကောင်တစ်ယောက်က မည်သို့ သိမှတ်လဲ။
    action: >-
      ဆိုင်ကောင်တစ်ယောက် ပစ္စည်းစာရင်းတစ်ခု စစ်ဆေးပုံကို ကြည့်ပါ။ အဆင့်တိုင်းက ဘာအတွက်လဲ မေးမြန်းပါ။
    timebox: မိနစ်သုံးဆယ်သာ။
    whatToNotice: >-
      မည်သည့်အဆင့်များတွင် အချိန်အတော်အကြာပါသလဲနှင့် မည်သည့်အဆင့်များတွင် သတိထားစွာ ဖတ်ခြင်း သို့မဟုတ် ရေမတွက်ခြင်း လိုအပ်သလဲ မှတ်သားပါ။
    reflection: >-
      ခက်ခဲဆုပ်ဆောင်ခဲ့သည့် အဆင့်ကို ရေးသားပါ။
    nextFork: >-
      အလုပ်နေရာ၊ သင်ကြား၊ သို့မဟုတ် အလုပ်ချိန် မေးမြန်းခြင်းမတိုင်မီ ခွင့်ပြုသည့် ဆိုင်တစ်ခုတွင် ပစ္စည်းစာရင်းကို ကိုယ်တိုင် လုပ်ကြည့်ပါ။
