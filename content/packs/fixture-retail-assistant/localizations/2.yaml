  media:
    - id: exp-ask-about-a-stock-check
      reference: >-
        ဆိုင်ကောင်တစ်ယောက်က ကုန့်ထဲရှိ ပစ္စည်းများကို ရေမတွက်နေသည့် ပုံရိပ်အတု နေရာယူ။ အမှန်တကယ် ပုံများ မသုံးပါ။
      alternativeText: >-
        ဆိုင်ကောင်တစ်ယောက်သည် ကုန့်ထုတ်လှဲနေသည့် စာရင်းတစ်ခုကို လက်တစ်ဖက်တွင် ကိုင်ထားပြီး ကုန့်ပေါ်မှ ဘူးထဲတစ်ခုချင်းစီကို ယူဆင်းပြီး ကောင်တွင် သို့ရောက်ရန် ရွှေ့နေသည်။
      transcript: >-
        ပစ္စည်းစာရင်း ပုံအတွက် သရုပ်ဖွဲ့စည်းမှု စာသားအစားထိုးအတွက်။ ပုံတွင် လက်တွင် ပုံမှန်စာရင်းတစ်ခု ကိုင်ထားသော လူတစ်ယောက်၊ ကုန့်ပေါ်မှ ဘူးထဲတစ်ခုချင်းစီကို ယူဆင်းခြင်းနှင့် ကောင်ပေါ်သို့ ရွှေ့ခြင်း ပါဝင်သည်။
