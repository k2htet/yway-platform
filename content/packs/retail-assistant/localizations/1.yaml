schemaVersion: 1
packId: retail-assistant
packVersion: 1
locale: my
fixtureOnly: false
preview:
  headline: "ဖောက်သည်တစ်ဦးကို ဖြေကြည့်ပြီး ဆိုင်အလုပ်မှာ ဘာတွေ လုပ်ရသလဲ လေ့လာပါ"
  description: >-
    အက်ပ်ထဲမှာ ဆိုင်ဝန်ထမ်းတစ်ဦး ကြုံနိုင်တဲ့ အခြေအနေတစ်ခုကို မိနစ် ၅ ခန့် စမ်းကြည့်ပါ။ စိတ်ဝင်စားရင် အပြင်မှာလည်း လုပ်ကြည့်နိုင်တဲ့ အဆင့်ငယ်တစ်ခု ရှိပါတယ်။
title: "ဆိုင်အလုပ်ရဲ့ အခြေအနေတစ်ခုကို စမ်းကြည့်ပါ"
summary: >-
  ဒီလေ့လာရေးအစီအစဉ်မှာ ဆိုင်တစ်ဆိုင်၌ ဖောက်သည်ကို ကူညီရတဲ့ အခြေအနေတစ်ခုကို စမ်းကြည့်ရမှာပါ။ ဒီအလုပ်ကို ရွေးမရွေး မဆုံးဖြတ်ခင် ဘာတွေ လုပ်ရနိုင်သလဲ သတိပြုမိဖို့ ရည်ရွယ်ပါတယ်။ ဒါဟာ အလုပ်အကိုင် အကြံပေးချက် မဟုတ်ပါ။ တကယ့်ဆိုင်၊ အလုပ်ရှင် သို့မဟုတ် အလုပ်ခေါ်စာကိုလည်း မရည်ညွှန်းပါ။
limitations:
  - >-
    ဒါဟာ လေ့လာကြည့်ရှုခြင်းသာ ဖြစ်ပါတယ်။ အဖြေတစ်ခု ရွေးတာ၊ အဲဒီအဖြေက ဘာဖြစ်စေသလဲ ဖတ်တာနဲ့ ဒီမှာ တစ်ခုခု ရေးတာတွေက အလုပ်အကြောင်း သိဖို့ နည်းလမ်းတွေပါ။ လက်တွေ့လေ့ကျင့်မှု၊ အလုပ်အတွေ့အကြုံ သို့မဟုတ် သင့်စွမ်းရည်ကို အတည်ပြု စစ်ဆေးမှု မဟုတ်ပါ။
  - >-
    ဒီအစီအစဉ်က အလုပ်အကိုင်တွေကို အဆင့်သတ်မှတ်တာ၊ နှိုင်းယှဉ်တာ သို့မဟုတ် တစ်ခုခုကို အကြံပြုတာ မလုပ်ပါ။ သင် ဘာကို ကျွမ်းကျင်တယ်၊ ဒီအလုပ်နဲ့ ကိုက်ညီတယ်ဆိုတာကိုလည်း မဆုံးဖြတ်ပါ။
  - >-
    ဒီမှာ သင် သွားလျှောက်နိုင်တဲ့ တကယ့်ဆိုင်၊ ကုမ္ပဏီ၊ ပံ့ပိုးသူ သို့မဟုတ် အလုပ်ခေါ်စာကို အမည်ဖော်ပြထားတာ မရှိပါ။
  - >-
    ဒီအစီအစဉ်အတွက် ကုမ္ပဏီတစ်ခုခုက ငွေကြေး မပံ့ပိုးထားပါ။ ဘယ်လေ့လာရေးလုပ်ဆောင်ချက်တွေ ပါမယ်၊ ဘယ်အစဉ်နဲ့ ပေါ်မယ်ဆိုတာကိုလည်း ကုမ္ပဏီက မရွေးချယ်ထားပါ။
  - >-
    ဒီအစီအစဉ်မှာ သင်ရေးထားတာတွေကို အက်ပ်က ဒီဖုန်းထဲမှာ သိမ်းပါတယ်။ အွန်လိုင်းကို မပို့သလို ဆိုင် သို့မဟုတ် ကုမ္ပဏီကိုလည်း မပို့ပါ။
  - >-
    ဒီမြန်မာစာကို ရိုးရှင်းတဲ့ အင်္ဂလိပ်မူရင်းကနေ ဘာသာပြန်ထားတာပါ။ မြန်မာစာဖတ်တဲ့ လူငယ်တွေနဲ့ နားလည်နိုင်မှုကို မစမ်းသပ်ရသေးပါ။
  - >-
    လက်လှမ်းမီမှု စစ်ဆေးချက်က မျက်နှာပြင်ပေါ်က စာသားကိုသာ အကျုံးဝင်ပါတယ်။ တကယ့်ဖုန်းမှာ အသုံးပြုမှု၊ စခရင်ဖတ်စနစ်၊ စာလုံးကြီးကြီးနဲ့ ဖတ်ရမှုနဲ့ မြန်မာစာကြောင်း ဖြတ်ပုံတို့ကို သီးခြား စမ်းသပ်ဖို့ လိုနေပါသေးတယ်။
experiments:
  - id: exp-answer-a-missing-item
    title: "ဖောက်သည်တစ်ဦးက စင်ပေါ်မှာ မရှိတဲ့ ပစ္စည်းတစ်ခုကို မေးလာသည်"
    question: >-
      ဖောက်သည်တစ်ဦးက ရှေ့မှာ မတွေ့ရတဲ့ ပစ္စည်းကို မေးလာရင် ဆိုင်အလုပ်မှာ ဘာတွေ လုပ်ရနိုင်မလဲ။
    action: >-
      အောက်က အခြေအနေကို ဖတ်ပြီး သင် ဘယ်လို ဖြေမလဲ ရွေးပါ။ ပြီးရင် အဲဒီအဖြေက အလုပ်အကြောင်း ဘာပြောပြသလဲ ဖတ်ပါ။ အဖြေတစ်ခုထက်ပိုပြီး စမ်းကြည့်နိုင်ပါတယ်။ အဖြေမှန် တစ်ခုတည်း မရှိပါ။
    timebox: "အက်ပ်အတွင်း တစ်ခါ၌ မိနစ် ၅ ခန့်ကြာ။"
    whatToNotice: >-
      သင် ဘယ်အဖြေကို အရင် ရွေးခဲ့သလဲ။ ဖောက်သည်ကို စိတ်ချလက်ချ ဖြေနိုင်ဖို့ ဘာတွေ ထပ်သိဖို့ လိုမလဲ။ ဒီအခြေအနေမှာ အံ့ဩမိတာ ရှိရင် ဘာကြောင့်လဲဆိုတာ သတိပြုပါ။
    reflection: >-
      သင့်အဖြေကို ရွေးလိုက်ရတဲ့အခါ ဘယ်လို ခံစားရသလဲဆိုတာ စာကြောင်း နှစ်ကြောင်း သို့မဟုတ် သုံးကြောင်း ရေးပါ။ ဒီအလုပ်အကြောင်း မဆုံးဖြတ်ခင် တကယ့်ဆိုင်မှာ ဘာတစ်ခုကို ကြည့်ချင်သေးလဲဆိုတာလည်း ရေးပါ။
    nextFork: >-
      တကယ့်ဆိုင်မှာ ဘယ်လိုဖြစ်သလဲ သိချင်ရင် သွားလာရင်း ဖြတ်သန်းတဲ့ ဆိုင်တစ်ဆိုင်မှာ အလားတူ ပစ္စည်းတွေ ထားတဲ့စင်ကို ကြည့်နိုင်ပါတယ်။ ဒါမှမဟုတ် စင်ပေါ်မှာ မတွေ့တဲ့ ပစ္စည်းကို ဘယ်လို ရှာကြသလဲဆိုတာ ဆိုင်ဝန်ထမ်းတစ်ဦးကို မေးနိုင်ပါတယ်။ အလုပ်လျှောက်ဖို့၊ သင်တန်းတက်ဖို့ သို့မဟုတ် အလုပ်ချိန်တွေကို ကြိုတင် သဘောတူဖို့ မလိုပါ။ ဘယ်အချိန်မဆို ရပ်နိုင်ပါတယ်။
    interactiveTask:
      scenario: >-
        ဖောက်သည်တစ်ဦးက ကောင်တာဆီ ရောက်လာပြီး သူ့ဖုန်းကို ပြပါတယ်။ သူလိုချင်တဲ့ ပစ္စည်းတစ်မျိုးကို သူ့ရှေ့က စင်ပေါ်မှာ မတွေ့လို့ မေးပါတယ်။ သူ့နောက်မှာလည်း ဖောက်သည်တစ်ဦး စောင့်နေပါတယ်။
      actionPrompt: "သင် အရင်ဆုံး ဘာပြောမလဲ၊ ဘာလုပ်မလဲ ရွေးပါ။"
      choices:
        - id: check-where-it-is-stored
          text: "ရှာကြည့်ပေးမယ်လို့ ပြောပြီး စင်နဲ့ သိုလှောင်ခန်းကို ကိုယ်တိုင် သွားစစ်မယ်။"
          feedback: >-
            ကိုယ်တိုင် ရှာကြည့်ရင် ဒီဆိုင်မှာ ပစ္စည်းတွေ ဘယ်လို ထားသလဲ သိလာနိုင်ပါတယ်။ ဒါပေမဲ့ သင် ရှာနေချိန် ဖောက်သည်က စောင့်ရပါမယ်။ စောင့်ရတာနဲ့ ကိုယ့်ဆိုင်က စင်တွေကို သိထားရတာဟာ ဒီအလုပ်ရဲ့ အစိတ်အပိုင်းတွေပါ။ သွားရှာမယ်လို့ ဆုံးဖြတ်ရတာ ဘယ်လို ခံစားရသလဲ သတိပြုပါ။
        - id: say-it-is-not-there-and-offer-something-else
          text: "စင်ပေါ်မှာ မရှိဘူးလို့ ပြောပြီး အလားတူ ပစ္စည်းတစ်ခု လိုချင်မလား မေးမယ်။"
          feedback: >-
            အလားတူ ပစ္စည်းကို ပြောပြရင် စကားဆက်ရတာ ပိုမြန်နိုင်ပါတယ်။ ဆိုင်မှာ တခြား ဘာပစ္စည်းတွေ ရှိသလဲဆိုတာကိုလည်း သတိထားဖို့ လိုပါတယ်။ ဖောက်သည်တချို့က အစားထိုးပစ္စည်းကို လိုချင်နိုင်ပေမဲ့ တချို့က မလိုချင်ပါ။ မရှိဘူးလို့ ပြောရတာ ဘယ်လို ခံစားရသလဲ သတိပြုပါ။
        - id: ask-someone-else-before-answering
          text: "မဖြေခင် အဲဒီပစ္စည်း ဘယ်မှာရှိနိုင်သလဲဆိုတာ လုပ်ဖော်ကိုင်ဖက် သို့မဟုတ် တာဝန်ခံကို မေးမယ်။"
          feedback: >-
            ပိုသိနိုင်တဲ့သူကို မေးရင် အဖြေရှာရလွယ်နိုင်ပေမဲ့ ဖောက်သည်က နည်းနည်း ပိုစောင့်ရပါမယ်။ ဘယ်သူ့ကို ဘယ်အချိန် မေးရမလဲ သိတာလည်း ဒီအလုပ်ရဲ့ အစိတ်အပိုင်းပါ။ ဖောက်သည်ရှေ့မှာ သူများကို မေးရတာဟာ အလုပ်လွှဲပေးသလို ခံစားရနိုင်ပါတယ်။ ကိုယ်တိုင် မဆုံးဖြတ်ဘဲ မေးလိုက်ရတာ ဘယ်လို ခံစားရသလဲ သတိပြုပါ။
  - id: exp-ask-a-shop-worker
    title: "စင်ပေါ်မှာ မရှိတဲ့ ပစ္စည်းကို ဘယ်လို ရှာသလဲ ဆိုင်ဝန်ထမ်းကို မေးပါ"
    question: "စင်ပေါ်မှာ မရှိတဲ့ ပစ္စည်းကို ဆိုင်ဝန်ထမ်းက တကယ် ဘယ်လို ရှာသလဲ။"
    action: >-
      သဘောတူတဲ့ ဆိုင်တစ်ဆိုင်မှာ ဝန်ထမ်းတစ်ဦးကို စင်ပေါ်မှာ မရှိတဲ့ ပစ္စည်းကို ဖောက်သည်က မေးရင် ဘယ်လို ကိုင်တွယ်သလဲ မေးပါ။ အရင်ဆုံး ဘာစစ်သလဲ၊ ဘယ်သူ့ကို အကူအညီ တောင်းသလဲ၊ ပစ္စည်းကို ရှာမတွေ့ရင် ဘာပြောသလဲ မေးပါ။ အရင်က ကြုံဖူးတဲ့အဖြစ်အပျက် သို့မဟုတ် စိတ်ကူးထားတဲ့အခြေအနေကို ပြောပြနိုင်ပါတယ်။ သင် ရောက်နေချိန်မှာ ဖောက်သည်တစ်ဦးက အဲဒီလို မေးဖို့ မလိုပါ။
    timebox: "သဘောတူတဲ့ ဆိုင်တစ်ဆိုင်မှာ တစ်ကြိမ်၊ မိနစ် ၁၀ ခန့်။"
    whatToNotice: >-
      ဝန်ထမ်းက ဘယ်အဆင့်တွေကို ကိုယ်တိုင် လုပ်နိုင်တယ်လို့ ပြောသလဲ၊ ဘယ်အချိန်မှာ တခြားသူကို မေးမယ်လို့ ပြောသလဲ သတိပြုပါ။ ပစ္စည်းကို ရှာမတွေ့ရင် ဖောက်သည်ကို ဘယ်လို ပြောမယ်လို့ ဆိုသလဲ သတိပြုပါ။
    reflection: >-
      ဝန်ထမ်း ပြောပြခဲ့တာထဲက သင် အရင်က မစဉ်းစားမိတဲ့ အချက်တစ်ခုနဲ့ ထပ်မေးချင်သေးတဲ့ မေးခွန်းတစ်ခုကို စာကြောင်း နှစ်ကြောင်း သို့မဟုတ် သုံးကြောင်း ရေးပါ။
    nextFork: >-
      စိတ်ဝင်စားသေးရင် ပိုစည်ကားတဲ့အချိန်မှာ နောက်ထပ် ဆိုင်တစ်ဆိုင်ကို ကြည့်နိုင်ပါတယ်။ အဲဒီဆိုင်ရဲ့ အစည်ကားဆုံးနေ့မှာ အလုပ်ဘယ်လို ဖြစ်သလဲလည်း မေးနိုင်ပါတယ်။ ဆိုင်ကို သင့်နာမည်၊ ဖုန်းနံပါတ် သို့မဟုတ် နေရပ်လိပ်စာ ပေးဖို့ မလိုပါ။ ဒီမှာ သင်ရေးထားတာတွေကို အက်ပ်က ဘယ်ဆိုင်ကိုမှ မပို့ပါ။ အလုပ်လျှောက်ဖို့၊ သင်တန်းတက်ဖို့ သို့မဟုတ် အလုပ်ချိန်တွေကို သဘောတူဖို့ မလိုပါ။ ဒီမှာပဲ ရပ်ဖို့ ဆုံးဖြတ်လည်း ရပါတယ်။
